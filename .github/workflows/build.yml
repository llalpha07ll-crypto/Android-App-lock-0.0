
      - name: Fix Invalid XML Attributes
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("extracted")
          fixed = 0

          for file in root.rglob("*.xml"):
              content = file.read_text(encoding="utf-8")

              updated = re.sub(
                  r'\s+android:child(?:Providers|Dividers)\s*=\s*"[^"]*"',
                  '',
                  content
              )

              if updated != content:
                  file.write_text(updated, encoding="utf-8")
                  print("FIXED:", file)
                  fixed += 1

          print("XML files fixed:", fixed)

          remaining = []
          for file in root.rglob("*.xml"):
              if re.search(
                  r'android:child(?:Providers|Dividers)\s*=',
                  file.read_text(encoding="utf-8")
              ):
                  remaining.append(str(file))

          if remaining:
              raise SystemExit("ERROR: Invalid attributes remain: " + str(remaining))
          PY

name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          ls -la
          mkdir -p proj
          if ls *.zip >/dev/null 2>&1; then
            unzip -q -o "$(ls *.zip | head -n 1)" -d proj
            G=$(find proj -name gradlew | head -n 1)
            D=$(dirname "$G")
          else
            D=.
          fi
          echo "Project folder: $D"
          cd "$D"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p /tmp/out
          cp "$(find . -name app-debug.apk | head -n 1)" /tmp/out/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-lock-apk
          path: /tmp/out/app-debug.apk

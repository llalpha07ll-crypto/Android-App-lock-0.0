name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Unzip project
        run: unzip -q AppLock.zip -d proj

      - name: Build debug APK
        working-directory: proj/AppLock
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-lock-apk
          path: proj/AppLock/app/build/outputs/apk/debug/app-debug.apk


      - name: Fix Invalid Android XML Attribute
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("extracted")
          fixed = 0

          for file in root.rglob("*.xml"):
              content = file.read_text(encoding="utf-8")
              updated = re.sub(
                  r'\s+android:childProviders\s*=\s*("[^"]*"|\'[^\']*\')',
                  '',
                  content
              )

              if updated != content:
                  file.write_text(updated, encoding="utf-8")
                  print(f"Fixed: {file}")
                  fixed += 1

          print(f"Total XML files fixed: {fixed}")
          PY

name:AppLock APK Builder
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          unzip -q "$ZIP" -d extracted
          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          test -n "$WRAPPER" || { echo "gradlew not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Fix XML
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          for f in pathlib.Path("extracted").rglob("*.xml"):
              s = f.read_text()
              s = re.sub(
                  r'\s+android:child(?:Providers|Dividers)\s*=\s*"[^"]*"',
                  '',
                  s
              )
              f.write_text(s)
          PY

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
